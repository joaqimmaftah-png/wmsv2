name: CI — Lint, Unit Tests, Migrations & Live Smoke Tests

on:
  push:
  pull_request:

jobs:
  php-lint-and-unit:
    name: PHP ${{ matrix.php }} Lint & Unit Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax lint all PHP files
        run: find application system tests scripts index.php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null

      - name: Run unit & regression test suite
        run: php tests/run.php

  database-and-e2e:
    name: DB Schema, Migrations & HTTP E2E (${{ matrix.db_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_label: MySQL 8.0 (Strict Production)
            image: mysql:8.0
            root_pass: rootpass
          - db_label: MariaDB 10.4 (XAMPP Compatible)
            image: mariadb:10.4
            root_pass: rootpass
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ matrix.root_pass }}
          MYSQL_DATABASE: wms_fresh
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd, mbstring
          coverage: none

      - name: Verify fresh install from database/schema.sql
        env:
          WMS_DB_HOST: 127.0.0.1
          WMS_DB_PORT: 3306
          WMS_DB_USER: root
          WMS_DB_PASS: ${{ matrix.root_pass }}
          WMS_DB_NAME: wms_fresh
        run: |
          php scripts/migrate.php --schema --verify

      - name: Verify standalone `migrate.php --verify` applies pending migrations & merges stale duplicates
        env:
          WMS_DB_HOST: 127.0.0.1
          WMS_DB_PORT: 3306
          WMS_DB_USER: root
          WMS_DB_PASS: ${{ matrix.root_pass }}
          WMS_DB_NAME: wms_fresh
        run: |
          mysql -h 127.0.0.1 -uroot -p"${{ matrix.root_pass }}" wms_fresh -e "
            DELETE FROM schema_migrations WHERE version IN ('0012', '0013');
            UPDATE equipment SET model = 'TOYOTA LC' WHERE registration_no IN ('C-LV 003', 'C-LV 008', 'C-LV 009', 'C-LV 012');
            INSERT INTO equipment (equipment_type_id, registration_no, legacy_code, brand, model, year, serial_number, frame_no, status)
            VALUES (2, 'EX 001', 'EX 001', 'CATERPILAR', 'SY500H', 2019, 'SN-EX-001', 'SY048CE0007K8', 'Available');
          "
          php scripts/migrate.php --verify
          COUNT=$(mysql -N -h 127.0.0.1 -uroot -p"${{ matrix.root_pass }}" wms_fresh -e "SELECT COUNT(*) FROM equipment;")
          [ "$COUNT" -eq 116 ] || { echo "Expected exact 116 rows after duplicate merge, got $COUNT"; exit 1; }

      - name: Verify idempotent re-run of all migrations (twice in a row)
        env:
          WMS_DB_HOST: 127.0.0.1
          WMS_DB_PORT: 3306
          WMS_DB_USER: root
          WMS_DB_PASS: ${{ matrix.root_pass }}
          WMS_DB_NAME: wms_fresh
        run: |
          php scripts/migrate.php --force --verify
          php scripts/migrate.php --force --verify
          php scripts/migrate.php --status

      - name: Seed test accounts & run live authenticated HTTP + XLSX smoke test
        env:
          CI_ENV: development
          WMS_DB_HOST: 127.0.0.1
          WMS_DB_PORT: 3306
          WMS_DB_USER: root
          WMS_DB_PASS: ${{ matrix.root_pass }}
          WMS_DB_NAME: wms_fresh
          WMS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          php scripts/create-admin.php admin@ci.local "AdminPass123!" "CI" "Supervisor" 1
          php scripts/create-admin.php ceo@ci.local "AdminPass123!" "CI" "Executive" 5
          php -S 127.0.0.1:8000 index.php >/tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'echo "::error title=Step8Bash::Failed at line $LINENO (server log tail: $(tail -n 5 /tmp/php-server.log 2>/dev/null | tr "\n" " "))"; kill $SERVER_PID 2>/dev/null || true' ERR
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 2

          # Authenticate via CSRF-protected POST /login (omit -X POST so -L follows 302 as GET!)
          COOKIES=/tmp/cookies.txt
          LOGIN_HTML=$(curl -fsSL -c "$COOKIES" http://127.0.0.1:8000/login)
          CSRF=$(python3 -c 'import re,sys; m=re.search(r"name=[\x27\"]csrf_token_wms[\x27\"]\s+value=[\x27\"]([^\x27\"]+)", sys.stdin.read()); assert m; print(m.group(1))' <<<"$LOGIN_HTML")
          curl -fsSL -b "$COOKIES" -c "$COOKIES" http://127.0.0.1:8000/login \
            --data-urlencode "csrf_token_wms=$CSRF" \
            --data-urlencode "email=admin@ci.local" \
            --data-urlencode "password=AdminPass123!" >/dev/null

          for ROUTE in dashboard equipment workorders pm inspections materials spareparts suppliers orders lubricants team team/report team/create attendance attendance/sites attendance/board attendance/print_qr attendance/log backlog reports forecast users users/create settings; do
            BODY=$(curl -fsSL -b "$COOKIES" -c "$COOKIES" "http://127.0.0.1:8000/$ROUTE")
            if echo "$BODY" | grep -Eq "Severity: (Warning|Notice|Deprecated|Error)|Fatal error|Uncaught|Database Error"; then
              echo "PHP error output found on /$ROUTE!"
              exit 1
            fi
          done

          # Verify XLSX binary export starts with valid ZIP magic PK\x03\x04
          curl -fsSL -b "$COOKIES" -c "$COOKIES" "http://127.0.0.1:8000/reports/export_annual_report_xlsx" -o /tmp/annual.xlsx
          python3 -c 'data=open("/tmp/annual.xlsx","rb").read(); assert data[:4]==b"PK\x03\x04", f"Corrupt XLSX header: {data[:80]!r}"; print("Valid XLSX bytes:", len(data))'

          # Live end-to-end verification of ATTENDANCE_WORKFLOW.md lifecycle + AML Timesheets
          php scripts/create-admin.php tech1@ci.local "AdminPass123!" "John" "Moshi" 2
          php scripts/create-admin.php mgr@ci.local "AdminPass123!" "CI" "Manager" 4
          python3 - <<'PY'
          import http.cookiejar, io, json, os, re, subprocess, tempfile, traceback, urllib.error, urllib.parse, urllib.request, zipfile, zlib

          try:
              cj = http.cookiejar.MozillaCookieJar('/tmp/cookies.txt')
              cj.load(ignore_discard=True, ignore_expires=True)
              opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
              BASE = 'http://127.0.0.1:8000'

              def get(path, op=opener):
                  return op.open(BASE + path).read().decode('utf-8', 'replace')

              def get_bytes(path, op=opener):
                  try:
                      r = op.open(BASE + path)
                      return r.status, r.headers, r.read()
                  except urllib.error.HTTPError as e:
                      return e.code, e.headers, e.read()

              def csrf_from(html):
                  m = re.search(r'name=["\x27]csrf_token_wms["\x27]\s+value=["\x27]([^"\x27]+)', html)
                  assert m, 'Missing csrf_token_wms in HTML'
                  return m.group(1)

              def post(path, fields, ajax=False):
                  data = urllib.parse.urlencode(fields).encode()
                  headers = {'X-Requested-With': 'XMLHttpRequest'} if ajax else {}
                  req = urllib.request.Request(BASE + path, data=data, headers=headers)
                  try:
                      r = opener.open(req)
                      return r.status, r.read().decode('utf-8', 'replace')
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode('utf-8', 'replace')

              # 1. Create active geofenced site with printed QR fallback enabled
              tok = csrf_from(get('/attendance/sites'))
              code, _ = post('/attendance/sites', {
                  'csrf_token_wms': tok,
                  'name': 'Workshop Main Gate',
                  'latitude': '-6.7924123',
                  'longitude': '39.2083456',
                  'radius_m': '150',
                  'max_accuracy_m': '100',
                  'is_active': '1',
                  'allow_static_qr': '1',
              })
              assert code == 200

              # 2. Enable attendance assignment gate & retention/grace policy
              tok = csrf_from(get('/attendance/sites'))
              code, _ = post('/attendance/policy', {
                  'csrf_token_wms': tok,
                  'attendance_gate_enabled': '1',
                  'attendance_open_session_policy': 'block',
                  'attendance_qr_ttl_seconds': '60',
                  'attendance_qr_grace_seconds': '120',
                  'attendance_location_retention_days': '365',
              })
              assert code == 200

              # 3. Before check-in, work-order picker must exclude unchecked-in technicians
              wo_create_before = get('/workorders/create')
              assert 'John Moshi' not in wo_create_before, 'Unchecked-in technician leaked into WO picker!'
              assert 'No technicians are currently checked in on site' in wo_create_before

              # 4. Issue rotating QR token; outside geofence must fail (422), inside must succeed (200)
              token_json = json.loads(get('/attendance/token'))
              assert token_json['ok'] is True
              qr_token = token_json['token']

              punch_page = get('/attendance/punch?t=' + urllib.parse.quote(qr_token))
              code422, body422 = post('/attendance/record', {
                  'csrf_token_wms': csrf_from(punch_page),
                  't': qr_token,
                  'lat': '-6.8500000',
                  'lng': '39.2083456',
                  'acc': '12',
                  'format': 'json',
              }, ajax=True)
              assert code422 == 422 and json.loads(body422)['ok'] is False

              punch_page = get('/attendance/punch?t=' + urllib.parse.quote(qr_token))
              code200, body200 = post('/attendance/record', {
                  'csrf_token_wms': csrf_from(punch_page),
                  't': qr_token,
                  'lat': '-6.7924200',
                  'lng': '39.2083500',
                  'acc': '12',
                  'format': 'json',
              }, ajax=True)
              res200 = json.loads(body200)
              assert code200 == 200 and res200['ok'] is True and res200['punch'] == 'check_in', body200

              # 5. Checked-in user now appears in WO picker while unchecked-in John Moshi stays excluded
              wo_create_after = get('/workorders/create')
              assert 'CI Supervisor' in wo_create_after, 'Checked-in user missing from WO picker!'
              assert 'John Moshi' not in wo_create_after, 'Unchecked-in technician leaked into WO picker!'

              # 6. Printable fixed QR poster renders valid v1.<site>.0.<mac> token
              print_html = get('/attendance/print_qr')
              assert re.search(r'v1\.\d+\.0\.[0-9a-f]{32}', print_html), 'Static printed QR token missing!'

              # 7. Live AML Individual Attendance Sheet E2E checks (Supervisor, Manager & Technician RBAC)
              def pdf_streams(raw):
                  out = []
                  for m in re.finditer(b'stream\r?\n(.*?)\r?\n?endstream', raw, re.S):
                      try:
                          out.append(zlib.decompress(m.group(1)))
                      except Exception:
                          out.append(m.group(1))
                  return b'\n'.join(out)

              rep_html = get('/team/report')
              assert 'All PDF Sheets' in rep_html and 'Workshop Main Gate' in rep_html, 'Live QR site missing from /team/report!'
              assert 'role="tablist"' in rep_html and 'id="tsDrawer"' in rep_html, 'Enterprise DataTable tabs/drawer missing!'
              assert '16/Jul/26' not in rep_html and 'MONTH OF JULY 2026' not in rep_html

              m_sup  = re.search(r'data-worker-row="(\d+)"[^>]*data-worker-name="CI Supervisor"', rep_html)
              m_tech = re.search(r'data-worker-row="(\d+)"[^>]*data-worker-name="John Moshi"', rep_html)
              assert m_sup and m_tech, 'Expected both CI Supervisor and John Moshi in /team/report'
              sup_id, tech_id = m_sup.group(1), m_tech.group(1)

              # Verify sorting, search, status tabs, card view & pagination query handling
              sorted_html = get('/team/report?sort=hours&dir=desc&tab=recorded&per_page=10&page=1')
              assert 'aria-sort="descending"' in sorted_html and 'CI Supervisor' in sorted_html
              search_html = get('/team/report?q=Moshi&view=cards')
              assert 'John Moshi' in search_html and 'data-worker-name="CI Supervisor"' not in search_html and 'ts-mode-cards' in search_html

              # Verify JSON Drawer endpoint for live weekly AML sheet inspection
              st_js, _, js_raw = get_bytes(f'/team/sheet_json/{sup_id}?period=full')
              js_doc = json.loads(js_raw.decode('utf-8'))
              assert st_js == 200 and js_doc.get('ok') is True and js_doc.get('full_name') == 'CI Supervisor'
              assert js_doc.get('site') == 'Workshop Main Gate' and len(js_doc.get('segments', [])) == 2

              # Verify Summary CSV export (UTF-8 BOM, filtered columns & multi-select ids)
              st_csv, _, csv_raw = get_bytes(f'/team/report_csv?ids={sup_id}')
              assert st_csv == 200 and csv_raw.startswith(b'\xef\xbb\xbf'), 'CSV missing UTF-8 BOM!'
              csv_txt = csv_raw.decode('utf-8-sig')
              assert 'CI Supervisor' in csv_txt and 'John Moshi' not in csv_txt and 'Hours Worked' in csv_txt

              st, hdrs, pdf1 = get_bytes(f'/team/timesheet/{sup_id}?period=full')
              assert st == 200 and pdf1[:8] == b'%PDF-1.4', 'Invalid single worker PDF'
              pdf1_txt = pdf_streams(pdf1)
              assert b'CI Supervisor' in pdf1_txt and b'Workshop Main Gate' in pdf1_txt, 'Live worker/site missing from PDF!'

              st, hdrs, xlsx1 = get_bytes(f'/team/timesheet/{sup_id}?period=full&format=xlsx')
              assert st == 200 and xlsx1[:4] == b'PK\x03\x04', 'Invalid single worker XLSX'
              with zipfile.ZipFile(io.BytesIO(xlsx1)) as zf:
                  assert 'xl/media/image1.png' in zf.namelist()
                  assert 'xl/worksheets/sheet1.xml' in zf.namelist()
                  assert 'xl/worksheets/sheet2.xml' in zf.namelist()

              st, _, batch_pdf = get_bytes(f'/team/timesheets_batch?period=h1&ids={sup_id}')
              assert st == 200 and batch_pdf[:8] == b'%PDF-1.4', 'Invalid multi-selected batch PDF'
              assert b'CI Supervisor' in pdf_streams(batch_pdf) and b'John Moshi' not in pdf_streams(batch_pdf)

              st, _, batch_xlsx = get_bytes('/team/timesheets_batch?period=h1&format=xlsx')
              assert st == 200 and batch_xlsx[:4] == b'PK\x03\x04', 'Invalid batch XLSX'

              def session_opener(email):
                  fd, jar_file = tempfile.mkstemp(prefix='wms_jar_', suffix='.txt')
                  login_p = subprocess.check_output(['curl', '-fsSL', '-c', jar_file, BASE + '/login']).decode('utf-8', 'replace')
                  tok0 = csrf_from(login_p)
                  subprocess.check_call([
                      'curl', '-fsSL', '-b', jar_file, '-c', jar_file, BASE + '/login',
                      '--data-urlencode', f'csrf_token_wms={tok0}',
                      '--data-urlencode', f'email={email}',
                      '--data-urlencode', 'password=AdminPass123!',
                  ], stdout=subprocess.DEVNULL)
                  mcj = http.cookiejar.MozillaCookieJar(jar_file)
                  mcj.load(ignore_discard=True, ignore_expires=True)
                  return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(mcj))

              # Manager (role_id = 4) read-only access succeeds across report, CSV, JSON drawer & PDF exports
              mgr_op = session_opener('mgr@ci.local')
              st_mgr_rep, _, mgr_rep_b = get_bytes('/team/report', mgr_op)
              st_mgr_js,  _, mgr_js_b  = get_bytes(f'/team/sheet_json/{sup_id}?period=h1', mgr_op)
              st_mgr_csv, _, mgr_csv_b = get_bytes('/team/report_csv', mgr_op)
              st_mgr1,    _, mgr_pdf   = get_bytes(f'/team/timesheet/{sup_id}?period=h1', mgr_op)
              st_mgr2,    _, mgr_batch = get_bytes('/team/timesheets_batch?period=h1', mgr_op)
              assert st_mgr_rep == 200 and b'All PDF Sheets' in mgr_rep_b
              assert st_mgr_js == 200 and json.loads(mgr_js_b.decode('utf-8')).get('ok') is True
              assert st_mgr_csv == 200 and mgr_csv_b.startswith(b'\xef\xbb\xbf')
              assert st_mgr1 == 200 and mgr_pdf[:8] == b'%PDF-1.4'
              assert st_mgr2 == 200 and mgr_batch[:8] == b'%PDF-1.4'

              # Technician (role_id = 2) Horizontal Privacy: sees ONLY own record on /team/report, /team/report_csv & /team/sheet_json
              tech_op = session_opener('tech1@ci.local')
              st_tech_rep, _, tech_rep_b = get_bytes('/team/report', tech_op)
              tech_rep_html = tech_rep_b.decode('utf-8', 'replace')
              assert st_tech_rep == 200 and 'My Attendance &amp; Timesheet' in tech_rep_html
              assert 'John Moshi' in tech_rep_html and 'CI Supervisor' not in tech_rep_html, 'Horizontal privacy leak on /team/report!'

              st_tech_csv, _, tech_csv_b = get_bytes('/team/report_csv', tech_op)
              tech_csv_txt = tech_csv_b.decode('utf-8-sig')
              assert st_tech_csv == 200 and 'John Moshi' in tech_csv_txt and 'CI Supervisor' not in tech_csv_txt, 'Horizontal privacy leak on CSV!'

              st_own_js, _, own_js_b = get_bytes(f'/team/sheet_json/{tech_id}?period=h1', tech_op)
              assert st_own_js == 200 and json.loads(own_js_b.decode('utf-8')).get('full_name') == 'John Moshi'
              st_forb_js, _, _ = get_bytes(f'/team/sheet_json/{sup_id}?period=h1', tech_op)
              assert st_forb_js == 403, f'Expected HTTP 403 for peer sheet_json, got {st_forb_js}'

              st_own, _, own_pdf = get_bytes(f'/team/timesheet/{tech_id}?period=h1', tech_op)
              assert st_own == 200 and own_pdf[:8] == b'%PDF-1.4' and b'John Moshi' in pdf_streams(own_pdf)
              st_other, hdr_other, other_body = get_bytes(f'/team/timesheet/{sup_id}?period=h1', tech_op)
              assert not other_body.startswith(b'%PDF-1.4'), 'Technician must NOT receive another user PDF!'

              # 8. Live Enterprise Workforce Directory (/team) E2E checks (Supervisor, Manager & Technician RBAC)
              sql_seed = f"""
              INSERT INTO certifications (user_id, cert_name, cert_number, issuing_body, issue_date, expiry_date, status)
              VALUES ({int(tech_id)}, 'Heavy Excavator Safety', 'CERT-EX-01', 'OSHA TZ', '2024-01-01', '2025-01-01', 'Valid');
              INSERT INTO work_orders (wo_number, equipment_id, title, type, priority, status, assigned_to, created_by)
              SELECT 'WO-CI-TEAM-01', id, 'Main boom cylinder seal leak', 'Corrective', 'Critical', 'In Progress', '{int(tech_id)}', {int(sup_id)}
              FROM equipment WHERE registration_no = 'EX 006' LIMIT 1;
              INSERT INTO leave_requests (user_id, leave_type, start_date, end_date, days_count, reason, status)
              VALUES ({int(tech_id)}, 'Annual Leave', '2026-11-10', '2026-11-12', 3, 'Family event', 'Pending');
              """
              subprocess.run(
                  ['mysql', '-h', '127.0.0.1', '-uroot', f'-p{os.environ["WMS_DB_PASS"]}', 'wms_fresh'],
                  input=sql_seed.encode('utf-8'),
                  check=True,
              )

              team_html = get('/team')
              assert 'role="tablist"' in team_html and 'id="tmDrawer"' in team_html, 'Missing tabs/drawer on /team!'
              assert '1 Expired' in team_html, 'Stale certification status was NOT auto-refreshed on /team!'
              assert '1 Open WO' in team_html, 'Pending leave approval queue missed live open WO warning!'
              assert 'On Site' in team_html, 'Live geofenced QR On Site badge missing on /team!'

              # Verify server-side status tabs, search, sorting & out-of-range pagination clamping
              cert_tab_html = get('/team?tab=cert_alert')
              assert 'John Moshi' in cert_tab_html and 'data-member-name="CI Supervisor"' not in cert_tab_html
              onsite_tab_html = get('/team?tab=on_site')
              assert 'data-member-name="CI Supervisor"' in onsite_tab_html and 'data-member-name="John Moshi"' not in onsite_tab_html
              clamp_html = get('/team?sort=active_wos&dir=desc&per_page=10&page=999')
              assert 'aria-sort="descending"' in clamp_html and 'John Moshi' in clamp_html

              # Verify Staff Inspector Drawer JSON endpoint (/team/member_json/{tech_id})
              st_mj, _, mj_raw = get_bytes(f'/team/member_json/{tech_id}')
              mj_doc = json.loads(mj_raw.decode('utf-8'))
              assert st_mj == 200 and mj_doc.get('ok') is True and mj_doc.get('full_name') == 'John Moshi'
              assert any(w.get('wo_number') == 'WO-CI-TEAM-01' and w.get('machine') == 'EX 006' for w in mj_doc.get('open_workorders', []))
              assert any(c.get('cert_name') == 'Heavy Excavator Safety' and c.get('status') == 'Expired' for c in mj_doc.get('certifications', []))

              # Verify Workforce Roster CSV export (UTF-8 BOM + multi-select ?ids= filter)
              st_rcsv, _, rcsv_raw = get_bytes(f'/team/roster_csv?ids={tech_id}')
              assert st_rcsv == 200 and rcsv_raw.startswith(b'\xef\xbb\xbf'), '/team/roster_csv missing UTF-8 BOM!'
              rcsv_txt = rcsv_raw.decode('utf-8-sig')
              assert 'John Moshi' in rcsv_txt and 'CI Supervisor' not in rcsv_txt and 'Active Work Orders' in rcsv_txt

              # Manager (role_id = 4) read-only access succeeds on /team, /team/roster_csv & /team/member_json while hiding mutations
              st_mgr_tm, _, mgr_tm_b = get_bytes('/team', mgr_op)
              mgr_tm_html = mgr_tm_b.decode('utf-8', 'replace')
              assert st_mgr_tm == 200 and 'Export CSV' in mgr_tm_html and 'Add Worker' not in mgr_tm_html and 'Edit Worker Profile' not in mgr_tm_html
              st_mgr_rc, _, mgr_rc_b = get_bytes('/team/roster_csv', mgr_op)
              assert st_mgr_rc == 200 and mgr_rc_b.startswith(b'\xef\xbb\xbf')
              st_mgr_mj, _, mgr_mj_b = get_bytes(f'/team/member_json/{tech_id}', mgr_op)
              assert st_mgr_mj == 200 and json.loads(mgr_mj_b.decode('utf-8')).get('ok') is True

              # Technician (role_id = 2) Horizontal Privacy on /team, /team/view/{peer} & /team/member_json/{peer}
              st_tech_tm, _, tech_tm_b = get_bytes('/team', tech_op)
              tech_tm_html = tech_tm_b.decode('utf-8', 'replace')
              assert st_tech_tm == 200 and 'John Moshi' in tech_tm_html and 'mgr@ci.local' not in tech_tm_html
              st_peer_view, _, peer_view_b = get_bytes(f'/team/view/{sup_id}', tech_op)
              assert b'admin@ci.local' not in peer_view_b, 'Horizontal PII leak on /team/view/{peer_id}!'
              st_own_mj, _, own_mj_b = get_bytes(f'/team/member_json/{tech_id}', tech_op)
              assert st_own_mj == 200 and json.loads(own_mj_b.decode('utf-8')).get('full_name') == 'John Moshi'
              st_forb_mj, _, _ = get_bytes(f'/team/member_json/{sup_id}', tech_op)
              assert st_forb_mj == 403, f'Expected HTTP 403 for peer member_json, got {st_forb_mj}'

              print('ALL LIVE ATTENDANCE WORKFLOW, WORKFORCE DIRECTORY & AML TIMESHEET E2E CHECKS PASSED!')
          except BaseException:
              tb = traceback.format_exc().replace('\n', '%0A')
              print(f'::error title=PythonE2E::{tb}', flush=True)
              raise
          PY

          # Headless Google Chrome Browser UI & Accessibility E2E Suite (1440x900 Desktop + 390x844 Mobile)
          node - <<'NODE'
          const fs = require('fs');
          const { spawn } = require('child_process');
          const assert = require('assert');
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          // Reuse authenticated Supervisor session cookie directly from /tmp/cookies.txt (zero login form race)
          const cookieLines = fs.readFileSync('/tmp/cookies.txt', 'utf8').split(/\r?\n/);
          const cookiesToSet = [];
          for (const rawLine of cookieLines) {
            const line = rawLine.trim().replace(/^#HttpOnly_/, '');
            if (!line || line.startsWith('#')) continue;
            const parts = line.split('\t');
            if (parts.length >= 7) {
              cookiesToSet.push({
                name: parts[5], value: parts[6], domain: '127.0.0.1', path: parts[2] || '/'
              });
            }
          }

          (async () => {
            const chrome = spawn('google-chrome', [
              '--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage',
              '--no-first-run', '--no-default-browser-check', '--user-data-dir=/tmp/wms-chrome-profile',
              '--remote-allow-origins=*', '--remote-debugging-port=9222',
              '--window-size=1440,900', 'about:blank'
            ], { stdio: 'ignore' });

            try {
              let targets = null;
              for (let i = 0; i < 80; i++) {
                try {
                  const r = await fetch('http://127.0.0.1:9222/json');
                  const j = await r.json();
                  if (Array.isArray(j) && j.find((t) => t.type === 'page')) { targets = j; break; }
                } catch (_) {}
                await sleep(250);
              }
              assert(targets, 'Chrome DevTools endpoint failed to start');
              const page = targets.find((t) => t.type === 'page');
              const ws = new WebSocket(page.webSocketDebuggerUrl);
              await new Promise((res, rej) => { ws.onopen = res; ws.onerror = rej; });

              let seq = 0;
              const pending = new Map();
              ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                if (msg.id && pending.has(msg.id)) {
                  const { resolve, reject } = pending.get(msg.id);
                  pending.delete(msg.id);
                  msg.error ? reject(new Error(JSON.stringify(msg.error))) : resolve(msg.result);
                }
              };
              const cdp = (method, params = {}) => new Promise((resolve, reject) => {
                const id = ++seq;
                pending.set(id, { resolve, reject });
                ws.send(JSON.stringify({ id, method, params }));
              });
              const evalJs = async (expression) => {
                const res = await cdp('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true });
                if (res.exceptionDetails) throw new Error('JS Exception: ' + JSON.stringify(res.exceptionDetails));
                return res.result ? res.result.value : undefined;
              };

              await cdp('Network.enable');
              for (const ck of cookiesToSet) {
                await cdp('Network.setCookie', ck);
              }
              await cdp('Page.enable');
              await cdp('Emulation.setDeviceMetricsOverride', { width: 1440, height: 900, deviceScaleFactor: 1, mobile: false });

              await cdp('Page.navigate', { url: 'http://127.0.0.1:8000/team/report' });
              for (let i = 0; i < 50; i++) {
                if (await evalJs('document.readyState === "complete" && Boolean(document.querySelector(".ts-row-chk"))')) break;
                await sleep(200);
              }

              // 1. Verify Desktop 1440px layout has ZERO horizontal scrollbar overflow & interactive controls work
              const desktopCheck = await evalJs(`(async () => {
                const docOverflow = document.documentElement.scrollWidth - window.innerWidth;
                const tblWrap = document.querySelector('.ts-table-wrap');
                const tblOverflow = tblWrap ? (tblWrap.scrollWidth - tblWrap.clientWidth) : -1;

                // Keyboard '/' focuses search input
                document.dispatchEvent(new KeyboardEvent('keydown', { key: '/', bubbles: true }));
                const slashFocused = (document.activeElement && document.activeElement.id === 'tsSearchInput');
                document.activeElement.blur();

                // Select first worker checkbox -> batch bar appears
                const chk = document.querySelector('.ts-row-chk');
                chk.checked = true;
                chk.dispatchEvent(new Event('change', { bubbles: true }));
                const batchVisible = !document.getElementById('tsBatchBar').hidden;
                const batchHref = document.getElementById('tsBatchPdf').getAttribute('href');

                // Click worker name -> right-side Slide-Over AML Sheet Drawer opens & fetches live JSON
                const trigger = document.querySelector('.ts-worker-name.js-open-sheet');
                trigger.focus();
                trigger.click();
                for (let w = 0; w < 25; w++) {
                  if (document.getElementById('tsDrawerBody').textContent.includes('WEEK 1')) break;
                  await new Promise((r) => setTimeout(r, 100));
                }
                const drawerOpen = !document.getElementById('tsDrawer').hidden;
                const drawerHasWeeks = document.getElementById('tsDrawerBody').textContent.includes('WEEK 1');
                const firstTitle = document.getElementById('tsDrawerTitle').textContent;

                // ArrowRight steps to next worker inside open drawer
                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
                await new Promise((r) => setTimeout(r, 300));
                const secondTitle = document.getElementById('tsDrawerTitle').textContent;

                // Escape closes drawer and restores focus to trigger element
                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
                const drawerClosed = document.getElementById('tsDrawer').hidden;
                const focusRestored = (document.activeElement === trigger);

                // Toggle Cards <-> Table view smoothly without reload
                document.querySelector('[data-set-view="cards"]').click();
                const cardsShown = getComputedStyle(document.querySelector('.ts-cards-container')).display !== 'none'
                  && getComputedStyle(document.querySelector('.ts-table-wrap')).display === 'none';
                document.querySelector('[data-set-view="table"]').click();

                return {
                  docOverflow, tblOverflow, slashFocused, batchVisible, batchHref,
                  drawerOpen, drawerHasWeeks, stepped: firstTitle !== secondTitle,
                  drawerClosed, focusRestored, cardsShown
                };
              })()`);

              assert(desktopCheck.docOverflow <= 0, 'Desktop viewport overflowed horizontally: ' + desktopCheck.docOverflow);
              assert(desktopCheck.tblOverflow <= 0, 'Desktop table wrapper overflowed horizontally: ' + desktopCheck.tblOverflow);
              assert(desktopCheck.slashFocused === true, 'Slash shortcut failed to focus search input');
              assert(desktopCheck.batchVisible === true && desktopCheck.batchHref.includes('ids='), 'Batch selection bar failed');
              assert(desktopCheck.drawerOpen && desktopCheck.drawerHasWeeks, 'Slide-over AML drawer failed to render weekly rows');
              assert(desktopCheck.stepped === true, 'ArrowRight navigation inside drawer did not advance to next worker');
              assert(desktopCheck.drawerClosed && desktopCheck.focusRestored, 'Escape key failed to close drawer & restore focus');
              assert(desktopCheck.cardsShown === true, 'View mode switcher failed to display Card View');

              // 2. Verify Mobile 390x844 responsive auto-card adaptation & zero horizontal overflow
              await cdp('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 2, mobile: true });
              await cdp('Page.navigate', { url: 'http://127.0.0.1:8000/team/report' });
              for (let i = 0; i < 40; i++) {
                if (await evalJs('document.readyState === "complete" && Boolean(document.getElementById("tsShell"))')) break;
                await sleep(200);
              }
              const mobileCheck = await evalJs(`(() => ({
                docOverflow: document.documentElement.scrollWidth - window.innerWidth,
                tableDisplay: getComputedStyle(document.querySelector('.ts-table-wrap')).display,
                cardsDisplay: getComputedStyle(document.querySelector('.ts-cards-container')).display
              }))()`);
              assert(mobileCheck.docOverflow <= 0, 'Mobile 390px viewport overflowed horizontally: ' + mobileCheck.docOverflow);
              assert(mobileCheck.tableDisplay === 'none' && mobileCheck.cardsDisplay === 'block', 'Mobile responsive Card View did not activate: ' + JSON.stringify(mobileCheck));

              // 3. Verify Desktop 1440x900 & Mobile 390x844 UI, Contrast & Drawer on /team
              await cdp('Emulation.setDeviceMetricsOverride', { width: 1440, height: 900, deviceScaleFactor: 1, mobile: false });
              await cdp('Page.navigate', { url: 'http://127.0.0.1:8000/team?sort=active_wos&dir=desc' });
              for (let i = 0; i < 50; i++) {
                if (await evalJs('document.readyState === "complete" && Boolean(document.querySelector(".tm-row-chk"))')) break;
                await sleep(200);
              }

              const teamDesktop = await evalJs(`(async () => {
                const docOverflow = document.documentElement.scrollWidth - window.innerWidth;
                const tblWrap = document.querySelector('.tm-table-wrap');
                const tblOverflow = tblWrap ? (tblWrap.scrollWidth - tblWrap.clientWidth) : -1;

                // Measure live WCAG contrast ratio of .tm-avatar foreground vs background
                function relLum(rgbStr) {
                  const m = rgbStr.match(/\\d+/g).map(Number).slice(0, 3).map((v) => {
                    const s = v / 255;
                    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
                  });
                  return 0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2];
                }
                const av = document.querySelector('.tm-avatar');
                const avStyle = getComputedStyle(av);
                const l1 = relLum(avStyle.color), l2 = relLum(avStyle.backgroundColor);
                const avatarContrast = (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);

                // Slash shortcut focuses #tmSearchInput
                document.dispatchEvent(new KeyboardEvent('keydown', { key: '/', bubbles: true }));
                const slashFocused = (document.activeElement && document.activeElement.id === 'tmSearchInput');
                document.activeElement.blur();

                // Multi-select checkbox reveals batch bar
                const chk = document.querySelector('.tm-row-chk');
                chk.checked = true;
                chk.dispatchEvent(new Event('change', { bubbles: true }));
                const batchVisible = !document.getElementById('tmBatchBar').hidden;
                const batchCsvHref = document.getElementById('tmBatchCsv').getAttribute('href');

                // Open Staff Inspector Drawer on first row (John Moshi with WO-CI-TEAM-01)
                const trigger = document.querySelector('.tm-staff-btn.js-open-member');
                trigger.focus();
                trigger.click();
                for (let w = 0; w < 25; w++) {
                  if (document.getElementById('tmDrawerBody').textContent.includes('WO-CI-TEAM-01')) break;
                  await new Promise((r) => setTimeout(r, 100));
                }
                const drawerOpen = !document.getElementById('tmDrawer').hidden;
                const drawerText = document.getElementById('tmDrawerBody').textContent;
                const hasWoAndCert = drawerText.includes('WO-CI-TEAM-01') && drawerText.includes('EX 006') && drawerText.includes('Heavy Excavator Safety');
                const firstName = document.getElementById('tmDrawerTitle').textContent;

                // ArrowRight steps to next staff member
                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
                await new Promise((r) => setTimeout(r, 250));
                const secondName = document.getElementById('tmDrawerTitle').textContent;

                // Escape closes drawer and restores focus
                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
                const drawerClosed = document.getElementById('tmDrawer').hidden;
                const focusRestored = (document.activeElement === trigger);

                // Toggle Cards <-> Table view
                document.querySelector('[data-set-view="cards"]').click();
                const cardsShown = getComputedStyle(document.querySelector('.tm-cards-container')).display !== 'none'
                  && getComputedStyle(document.querySelector('.tm-table-wrap')).display === 'none';
                document.querySelector('[data-set-view="table"]').click();

                return {
                  docOverflow, tblOverflow, avatarContrast, slashFocused, batchVisible, batchCsvHref,
                  drawerOpen, hasWoAndCert, stepped: firstName !== secondName,
                  drawerClosed, focusRestored, cardsShown
                };
              })()`);

              assert(teamDesktop.docOverflow <= 0, '/team Desktop viewport overflowed: ' + teamDesktop.docOverflow);
              assert(teamDesktop.tblOverflow <= 0, '/team Desktop table overflowed: ' + teamDesktop.tblOverflow);
              assert(teamDesktop.avatarContrast >= 4.5, '/team Avatar contrast failed WCAG AA: ' + teamDesktop.avatarContrast);
              assert(teamDesktop.slashFocused === true, '/team Slash shortcut failed');
              assert(teamDesktop.batchVisible && teamDesktop.batchCsvHref.includes('ids='), '/team Batch bar failed');
              assert(teamDesktop.drawerOpen && teamDesktop.hasWoAndCert, '/team Drawer missed WO-CI-TEAM-01 / EX 006 / Cert');
              assert(teamDesktop.stepped === true, '/team ArrowRight drawer navigation failed');
              assert(teamDesktop.drawerClosed && teamDesktop.focusRestored, '/team Escape close / focus restore failed');
              assert(teamDesktop.cardsShown === true, '/team Cards view switcher failed');

              await cdp('Emulation.setDeviceMetricsOverride', { width: 390, height: 844, deviceScaleFactor: 2, mobile: true });
              await cdp('Page.navigate', { url: 'http://127.0.0.1:8000/team' });
              for (let i = 0; i < 40; i++) {
                if (await evalJs('document.readyState === "complete" && Boolean(document.getElementById("tmShell"))')) break;
                await sleep(200);
              }
              const teamMobile = await evalJs(`(() => ({
                docOverflow: document.documentElement.scrollWidth - window.innerWidth,
                tableDisplay: getComputedStyle(document.querySelector('.tm-table-wrap')).display,
                cardsDisplay: getComputedStyle(document.querySelector('.tm-cards-container')).display
              }))()`);
              assert(teamMobile.docOverflow <= 0, '/team Mobile 390px overflowed: ' + teamMobile.docOverflow);
              assert(teamMobile.tableDisplay === 'none' && teamMobile.cardsDisplay === 'block', '/team Mobile Card View failed: ' + JSON.stringify(teamMobile));

              ws.close();
              console.log('ALL HEADLESS CHROME DESKTOP (1440x900) & MOBILE (390x844) UI E2E ASSERTIONS PASSED!');
            } catch (err) {
              console.error('::error title=ChromeUIE2E::' + (err && err.stack ? err.stack.replace(/\n/g, '%0A') : String(err)));
              process.exitCode = 1;
            } finally {
              chrome.kill('SIGKILL');
            }
          })();
          NODE


