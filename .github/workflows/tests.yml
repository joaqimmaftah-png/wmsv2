name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Run tests/run.php
        run: php tests/run.php

  syntax:
    name: PHP and shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l on every PHP file
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { echo "::error file=$file::PHP syntax error"; fail=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fail
      - name: bash -n on the scripts
        run: bash -n scripts/migrate.sh scripts/purge-secrets.sh
