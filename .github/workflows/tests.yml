                // Measure live WCAG contrast ratio of .tm-avatar foreground vs background
                function relLum(rgbStr) {
                  const m = rgbStr.match(/\\d+/g).map(Number).slice(0, 3).map((v) => {
                    const s = v / 255;
                    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
